[project]
name = "job-hunting-agent"
version = "0.1.0"
description = "就活メモ整理AIエージェント"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.36.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "google-generativeai==0.7.2",
    "google-auth==2.30.0",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.134.0",
    "httplib2==0.22.0",
    "python-dotenv==1.0.1",
    # 画像処理（EXIF向き補正・自動リサイズ・プレビュー）
    "Pillow==10.4.0",
    # FastAPI は将来拡張用に残す（今は使わない）
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "models", "services"]
